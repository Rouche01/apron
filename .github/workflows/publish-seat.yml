# Publish @useapron/seat via npm Trusted Publisher (OIDC) — no NPM_TOKEN.
# Tag form: seat-v0.1.0  (must equal packages/seat/package.json "version")
#
# Setup (once) on https://www.npmjs.com/package/@useapron/seat → Settings → Trusted Publisher:
#   - Publisher: GitHub Actions
#   - Organization or user: Rouche01
#   - Repository: computer-with-agent
#   - Workflow filename: publish-seat.yml   (filename only, not path)
#   - Allow npm publish (not only staged) if prompted
#
# Requires: npm CLI ≥ 11.5.1, Node ≥ 22.14, GitHub-hosted runner.
#
# Release:
#   1. Bump version in packages/seat/package.json
#   2. Merge to default branch
#   3. git tag seat-vX.Y.Z && git push origin seat-vX.Y.Z

name: Publish seat

on:
  push:
    tags:
      - "seat-v*"

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing

# One run per tag — overlapping re-runs / double pushes cancel the older one
concurrency:
  group: publish-seat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: npm publish @useapron/seat
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/seat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node ≥ 22.14; pin a current 22.x
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Bundled npm on some images is too old for OIDC publish
      - name: Ensure npm ≥ 11.5.1
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Tag matches package.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#seat-v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$EXPECTED" != "$PKG" ]; then
            echo "Tag version '$EXPECTED' != package.json version '$PKG'"
            exit 1
          fi
          echo "Publishing @useapron/seat@$PKG (tag $TAG)"
          npm --version
          node --version

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # OIDC auth; provenance attestations are automatic with trusted publishing.
      # Skip if the version is already on the registry (re-run / race after a successful publish).
      - name: Publish
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "${NAME}@${PKG}" version >/dev/null 2>&1; then
            echo "${NAME}@${PKG} is already on the registry — skipping publish"
            exit 0
          fi
          npm publish --access public
