name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gateway-tests:
    name: Gateway unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements-dev.txt

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Pytest (pool / providers / recording)
        env:
          WORKER_INVENTORY_PATH: ${{ github.workspace }}/gateway/workers.json
          REQUIRE_WORKER_INVENTORY: "1"
          COMPUTER_API_TOKEN: ""
          RECORDING_DIR: ${{ runner.temp }}/recordings
        run: |
          python -m pytest \
            test_pool_burst.py \
            test_pool_phone_lease.py \
            test_pool_register.py \
            test_recording.py \
            test_recording_api.py \
            test_tenancy.py \
            providers/test_phone_harness.py \
            -q

  client-tests:
    name: Client unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/client/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  seat-tests:
    name: Seat unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/seat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/seat/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
