# Apron — default: gateway + 2 desktop workers (no Compose profile).
# Copy .env.example → .env, then:  docker compose up --build -d
# Profiles / inventories: docs/profiles.md
#
#   # physical Android:
#   COMPOSE_PROFILES=phone WORKER_INVENTORY_FILE=./gateway/workers.with-phone.json \
#     docker compose up --build -d
#   # cloud Android (needs PHONE_HARNESS_API_KEY):
#   COMPOSE_PROFILES=phone-cloud \
#     WORKER_INVENTORY_FILE=./gateway/workers.with-phone-cloud.json \
#     docker compose up --build -d
#   # cloud-only first image build (phone-cloud reuses apron-phone:local):
#   docker compose --profile phone build phone-1

name: apron

x-desktop-worker: &desktop-worker
  image: apron-worker:local
  networks: [computer_internal]
  environment:
    ASPECT_RATIO: ${ASPECT_RATIO:-16:10}
    WIDTH: ${WIDTH:-1280}
    # Optional; entrypoint derives from ASPECT_RATIO × WIDTH when empty
    HEIGHT: ${HEIGHT:-}
  shm_size: "256mb"
  healthcheck:
    test:
      [
        "CMD",
        "python3",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
      ]
    # Cold host reboot: X + x11vnc can take >45s
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 90s
  restart: unless-stopped

x-phone-healthcheck: &phone-healthcheck
  test:
    [
      "CMD",
      "python3",
      "-c",
      "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)",
    ]
  interval: 10s
  timeout: 5s
  retries: 12

services:
  worker-1:
    <<: *desktop-worker
    build:
      context: .
      dockerfile: Dockerfile
    hostname: worker-1
    # noVNC for humans / HITL (control API stays internal-only)
    ports:
      - "6081:6080"

  # Same image as worker-1 — no build here (BuildKit races on tag).
  worker-2:
    <<: *desktop-worker
    hostname: worker-2
    ports:
      - "6082:6080"

  # Physical phone seat. Opt-in via profile phone.
  # Boot ADB_* optional; attach later via POST /v1/seats/{id}/bind or /devices/register.
  phone-1:
    profiles: ["phone"]
    # Google platform-tools are linux/amd64 (needed for adb pair).
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.phone
    image: apron-phone:local
    networks: [computer_internal]
    ports:
      - "8003:8003"
    environment:
      PORT: "8003"
      HOME: /root
      ADB_SERIAL: ${ADB_SERIAL:-}
      ADB_CONNECT: ${ADB_CONNECT:-}
      ALLOW_EMPTY_DEVICE: "1"
      RESET_FORCE_STOP_PACKAGES: ${RESET_FORCE_STOP_PACKAGES:-}
      RECYCLE_CLEAR_PACKAGES: ${RECYCLE_CLEAR_PACKAGES:-}
      SCRCPY_WEB_URL: ${PHONE_HITL_URL:-http://localhost:6083/watch.html}
    volumes:
      # Host keys so the phone trusts this adb identity (Allow once).
      - ${HOME}/.android:/root/.android
    healthcheck:
      <<: *phone-healthcheck
      start_period: 30s
    restart: unless-stopped

  # Phone HITL Watch (lease vnc_url → :6083). Device may arrive later via bind API.
  scrcpy-web:
    profiles: ["phone"]
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.scrcpy
      args:
        WS_SCRCPY_REPO: ${WS_SCRCPY_REPO:-https://github.com/Mel0nFish/ws-scrcpy-enhanced.git}
        WS_SCRCPY_REF: ${WS_SCRCPY_REF:-32e58f9aa330bb30454d9fe31251c550008fc373}
    image: apron-scrcpy:local
    networks: [computer_internal]
    ports:
      - "6083:8000"
    environment:
      HOME: /root
      ADB_SERIAL: ${ADB_SERIAL:-}
      ADB_CONNECT: ${ADB_CONNECT:-}
      WS_SCRCPY_CONFIG: /opt/ws-scrcpy/config.yaml
    volumes:
      - ${HOME}/.android:/root/.android
    depends_on:
      phone-1:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8000/',(r)=>{r.resume();process.exit(r.statusCode&&r.statusCode<500?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  # Cloud phone seat (provider=phone-harness). Reuses apron-phone:local from phone-1 build.
  phone-cloud-1:
    profiles: ["phone-cloud"]
    platform: linux/amd64
    image: apron-phone:local
    networks: [computer_internal]
    ports:
      - "8004:8003"
    environment:
      PORT: "8003"
      HOME: /root
      ALLOW_EMPTY_DEVICE: "1"
      RESET_FORCE_STOP_PACKAGES: ${RESET_FORCE_STOP_PACKAGES:-}
      RECYCLE_CLEAR_PACKAGES: ${RECYCLE_CLEAR_PACKAGES:-}
    healthcheck:
      <<: *phone-healthcheck
      start_period: 20s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: apron-gateway:local
    networks: [computer_internal]
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      COMPUTER_API_TOKEN: ${COMPUTER_API_TOKEN:-dev-token}
      GATEWAY_PUBLIC_BASE: ${GATEWAY_PUBLIC_BASE:-http://localhost:9000}
      WORKER_INVENTORY_PATH: /etc/computer/workers.json
      REQUIRE_WORKER_INVENTORY: "1"
      SESSION_TTL_SEC: ${SESSION_TTL_SEC:-600}
      PARKED_TTL_SEC: ${PARKED_TTL_SEC:-1800}
      SCRCPY_ADB_API_URL: ${SCRCPY_ADB_API_URL:-http://scrcpy-web:8001}
      PHONE_HARNESS_API_KEY: ${PHONE_HARNESS_API_KEY:-}
      PHONE_HARNESS_API_BASE: ${PHONE_HARNESS_API_BASE:-https://api.phone-harness.com}
      PHONE_HARNESS_TIMEOUT_SEC: ${PHONE_HARNESS_TIMEOUT_SEC:-}
      PHONE_HARNESS_PROFILE_ID: ${PHONE_HARNESS_PROFILE_ID:-}
      RECORDING_DIR: ${RECORDING_DIR:-/data/recordings}
      RECORDING_TTL_SEC: ${RECORDING_TTL_SEC:-604800}
      RECORD_SESSIONS_DEFAULT: ${RECORD_SESSIONS_DEFAULT:-0}
      RECORDING_MAX_FRAME_BYTES: ${RECORDING_MAX_FRAME_BYTES:-2000000}
      RECORDING_BACKEND: ${RECORDING_BACKEND:-local}
      RECORDING_S3_BUCKET: ${RECORDING_S3_BUCKET:-}
      RECORDING_S3_PREFIX: ${RECORDING_S3_PREFIX:-recordings}
      RECORDING_S3_ENDPOINT: ${RECORDING_S3_ENDPOINT:-}
      RECORDING_S3_REGION: ${RECORDING_S3_REGION:-}
      RECORDING_S3_ACCESS_KEY: ${RECORDING_S3_ACCESS_KEY:-}
      RECORDING_S3_SECRET_KEY: ${RECORDING_S3_SECRET_KEY:-}
      # Hosted soft tenancy (optional). Leave unset for OSS single-token mode.
      # TENANTS_PATH: /etc/computer/tenants.json
      # Stripe billing (optional) — see docs/hosted.md Billing / .env.example
      # STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      # STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      # BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-}
      # BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-}
      # BILLING_PORTAL_RETURN_URL: ${BILLING_PORTAL_RETURN_URL:-}
    volumes:
      # Host file must exist (missing path → Docker mounts an empty dir → gateway exits).
      - ${WORKER_INVENTORY_FILE:-./gateway/workers.json}:/etc/computer/workers.json:ro
      - gateway_recordings:/data/recordings
      # Uncomment with TENANTS_PATH for multi-customer keys (see docs/hosted.md):
      # Invite-only hand edits: :ro. Stripe Checkout provision needs rw (omit :ro).
      # - ${TENANTS_FILE:-./gateway/tenants.json}:/etc/computer/tenants.json:ro
      # - ${TENANTS_FILE:-./gateway/tenants.json}:/etc/computer/tenants.json
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  gateway_recordings:

networks:
  computer_internal:
    driver: bridge
    name: computer_internal
