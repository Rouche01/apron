# Apron — default: gateway + 2 desktop workers (no Compose profile).
# Copy .env.example → .env, then:  docker compose up --build -d
# Profiles / inventories: docs/profiles.md
#
#   # physical Android:
#   COMPOSE_PROFILES=phone WORKER_INVENTORY_FILE=./gateway/workers.with-phone.json \
#     docker compose up --build -d
#   # cloud Android (needs PHONE_HARNESS_API_KEY):
#   COMPOSE_PROFILES=phone-cloud \
#     WORKER_INVENTORY_FILE=./gateway/workers.with-phone-cloud.json \
#     docker compose up --build -d

services:
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: apron-worker:local
    hostname: worker-1
    networks: [computer_internal]
    # noVNC for humans / HITL (control API stays internal-only)
    ports:
      - "6081:6080"
    environment:
      ASPECT_RATIO: ${ASPECT_RATIO:-16:10}
      WIDTH: ${WIDTH:-1280}
      # Optional override; if unset, entrypoint derives from ASPECT_RATIO × WIDTH
      HEIGHT: ${HEIGHT:-}
    shm_size: "256mb"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      # Cold host reboot: X + x11vnc can take >45s; keep start_period generous.
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: unless-stopped

  # Same image as worker-1 — do not declare build here (BuildKit races on tag).
  worker-2:
    image: apron-worker:local
    hostname: worker-2
    networks: [computer_internal]
    ports:
      - "6082:6080"
    environment:
      ASPECT_RATIO: ${ASPECT_RATIO:-16:10}
      WIDTH: ${WIDTH:-1280}
      HEIGHT: ${HEIGHT:-}
    shm_size: "256mb"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: unless-stopped

  # Third seat (kind=phone). Opt-in via profile so desktop-only deploys stay unchanged.
  # Bridge network (same as gateway/workers) so gateway can call http://phone-1:8003.
  # Prefer wireless ADB (ADB_CONNECT=ip:5555) — Docker Desktop Mac cannot share USB
  # via network_mode:host, and host.docker.internal:8003 does not reach host-network
  # containers on Mac. Mount ~/.android so the phone trusts this adb key.
  phone-1:
    profiles: ["phone"]
    build: &apron-phone-build
      context: .
      dockerfile: Dockerfile.phone
    image: apron-phone:local
    networks: [computer_internal]
    ports:
      - "8003:8003"
    environment:
      PORT: "8003"
      HOME: /root
      ADB_SERIAL: ${ADB_SERIAL:-}
      ADB_CONNECT: ${ADB_CONNECT:-}
      RESET_FORCE_STOP_PACKAGES: ${RESET_FORCE_STOP_PACKAGES:-}
      RECYCLE_CLEAR_PACKAGES: ${RECYCLE_CLEAR_PACKAGES:-}
      SCRCPY_WEB_URL: ${PHONE_HITL_URL:-http://localhost:6083/watch.html}
    volumes:
      # Same RSA keys the host used to authorize the phone (otherwise wireless = unauthorized).
      - ${HOME}/.android:/root/.android
    # USB device access is host/OS-specific; wireless ADB needs only network + adb connect.
    # devices:
    #   - /dev/bus/usb
    # privileged: true
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Browser HITL for phone seats (lease vnc_url → :6083). Same ADB as phone-1.
  # Watch-only for dogfood; intervene via gateway actions / physical device.
  scrcpy-web:
    profiles: ["phone"]
    build:
      context: .
      dockerfile: Dockerfile.scrcpy
      args:
        # Mel0nFish/ws-scrcpy-enhanced @ scrcpy-server 3.3.4 (Android 16 video)
        WS_SCRCPY_REPO: ${WS_SCRCPY_REPO:-https://github.com/Mel0nFish/ws-scrcpy-enhanced.git}
        WS_SCRCPY_REF: ${WS_SCRCPY_REF:-32e58f9aa330bb30454d9fe31251c550008fc373}
    image: apron-scrcpy:local
    networks: [computer_internal]
    ports:
      - "6083:8000"
    environment:
      HOME: /root
      ADB_SERIAL: ${ADB_SERIAL:-}
      ADB_CONNECT: ${ADB_CONNECT:-}
      WS_SCRCPY_CONFIG: /opt/ws-scrcpy/config.yaml
    volumes:
      - ${HOME}/.android:/root/.android
    depends_on:
      phone-1:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8000/',(r)=>{r.resume();process.exit(r.statusCode&&r.statusCode<500?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  # Cloud phone seat (kind=phone, provider=phone-harness). Bound on lease — no
  # host ADB keys / scrcpy. Opt-in via profile phone-cloud.
  # Same Dockerfile/image as phone-1 (no separate build helper — that showed as Exited in Docker Desktop).
  # If both phone + phone-cloud profiles are on and BuildKit races on the tag, retry or:
  #   docker compose --profile phone build phone-1 && docker compose up -d
  phone-cloud-1:
    profiles: ["phone-cloud"]
    build: *apron-phone-build
    image: apron-phone:local
    networks: [computer_internal]
    ports:
      - "8004:8003"
    environment:
      PORT: "8003"
      HOME: /root
      # Healthy before first lease (gateway provisions + bind).
      ALLOW_EMPTY_DEVICE: "1"
      RESET_FORCE_STOP_PACKAGES: ${RESET_FORCE_STOP_PACKAGES:-}
      RECYCLE_CLEAR_PACKAGES: ${RECYCLE_CLEAR_PACKAGES:-}
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: apron-gateway:local
    networks: [computer_internal]
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      COMPUTER_API_TOKEN: ${COMPUTER_API_TOKEN:-dev-token}
      GATEWAY_PUBLIC_BASE: ${GATEWAY_PUBLIC_BASE:-http://localhost:9000}
      WORKER_INVENTORY_PATH: /etc/computer/workers.json
      REQUIRE_WORKER_INVENTORY: "1"
      SESSION_TTL_SEC: ${SESSION_TTL_SEC:-600}
      PARKED_TTL_SEC: ${PARKED_TTL_SEC:-1800}
      # Phone profile: sync Watch adb when POST /v1/seats/{id}/bind (internal :8001).
      SCRCPY_ADB_API_URL: ${SCRCPY_ADB_API_URL:-http://scrcpy-web:8001}
      # Cloud phone provider (profile phone-cloud / inventory provider=phone-harness).
      PHONE_HARNESS_API_KEY: ${PHONE_HARNESS_API_KEY:-}
      PHONE_HARNESS_API_BASE: ${PHONE_HARNESS_API_BASE:-https://api.phone-harness.com}
      PHONE_HARNESS_TIMEOUT_SEC: ${PHONE_HARNESS_TIMEOUT_SEC:-}
      PHONE_HARNESS_PROFILE_ID: ${PHONE_HARNESS_PROFILE_ID:-}
      # Opt-in session recording journals (not video). Lease body record:true or default below.
      RECORDING_DIR: ${RECORDING_DIR:-/data/recordings}
      RECORDING_TTL_SEC: ${RECORDING_TTL_SEC:-604800}
      RECORD_SESSIONS_DEFAULT: ${RECORD_SESSIONS_DEFAULT:-0}
      RECORDING_MAX_FRAME_BYTES: ${RECORDING_MAX_FRAME_BYTES:-2000000}
      RECORDING_BACKEND: ${RECORDING_BACKEND:-local}
      RECORDING_S3_BUCKET: ${RECORDING_S3_BUCKET:-}
      RECORDING_S3_PREFIX: ${RECORDING_S3_PREFIX:-recordings}
      RECORDING_S3_ENDPOINT: ${RECORDING_S3_ENDPOINT:-}
      RECORDING_S3_REGION: ${RECORDING_S3_REGION:-}
      RECORDING_S3_ACCESS_KEY: ${RECORDING_S3_ACCESS_KEY:-}
      RECORDING_S3_SECRET_KEY: ${RECORDING_S3_SECRET_KEY:-}
      # Hosted soft tenancy (optional). Leave unset for OSS single-token mode.
      # TENANTS_PATH: /etc/computer/tenants.json
    volumes:
      # Host file must exist (missing path → Docker mounts an empty dir → gateway exits).
      # Physical phone: WORKER_INVENTORY_FILE=./gateway/workers.with-phone.json
      # Cloud / both: WORKER_INVENTORY_FILE=./gateway/workers.with-phone-cloud.json
      - ${WORKER_INVENTORY_FILE:-./gateway/workers.json}:/etc/computer/workers.json:ro
      - gateway_recordings:/data/recordings
      # Uncomment with TENANTS_PATH for multi-customer keys (see docs/hosted.md):
      # - ${TENANTS_FILE:-./gateway/tenants.json}:/etc/computer/tenants.json:ro
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  gateway_recordings:

networks:
  computer_internal:
    driver: bridge
    name: computer_internal
