# Computer Runtime: gateway (public) + exclusive desktop workers (internal).
# Optional phone seat: profile "phone" (third worker; see gateway/workers.with-phone.json).
# Lease/TTL recycle is handled by the gateway; release calls worker /session/reset.
#
#   docker compose up --build
#   # with Android seat (wireless/USB ADB on the host):
#   COMPOSE_PROFILES=phone WORKER_INVENTORY_FILE=./gateway/workers.with-phone.json \
#     docker compose up --build -d
#   export COMPUTER_API_TOKEN=dev-token   # must match .env
#   curl -s -H "Authorization: Bearer $COMPUTER_API_TOKEN" \
#     -X POST http://localhost:9000/v1/sessions

services:
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: computer-with-agent-worker:local
    hostname: worker-1
    networks: [computer_internal]
    # noVNC for humans / HITL (control API stays internal-only)
    ports:
      - "6081:6080"
    environment:
      ASPECT_RATIO: ${ASPECT_RATIO:-16:10}
      WIDTH: ${WIDTH:-1280}
      # Optional override; if unset, entrypoint derives from ASPECT_RATIO × WIDTH
      HEIGHT: ${HEIGHT:-}
    shm_size: "256mb"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      # Cold host reboot: X + x11vnc can take >45s; keep start_period generous.
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: unless-stopped

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: computer-with-agent-worker:local
    hostname: worker-2
    networks: [computer_internal]
    ports:
      - "6082:6080"
    environment:
      ASPECT_RATIO: ${ASPECT_RATIO:-16:10}
      WIDTH: ${WIDTH:-1280}
      HEIGHT: ${HEIGHT:-}
    shm_size: "256mb"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: unless-stopped

  # Third seat (kind=phone). Opt-in via profile so desktop-only deploys stay unchanged.
  # Host networking: share host adb (USB or wireless). Control API on host :8003.
  # Gateway reaches it via host.docker.internal (extra_hosts below).
  phone-1:
    profiles: ["phone"]
    build:
      context: .
      dockerfile: Dockerfile.phone
    image: computer-with-agent-phone:local
    network_mode: host
    environment:
      PORT: "8003"
      ADB_SERIAL: ${ADB_SERIAL:-}
      ADB_CONNECT: ${ADB_CONNECT:-}
      RESET_FORCE_STOP_PACKAGES: ${RESET_FORCE_STOP_PACKAGES:-}
      RECYCLE_CLEAR_PACKAGES: ${RECYCLE_CLEAR_PACKAGES:-}
      SCRCPY_WEB_URL: ${PHONE_HITL_URL:-http://localhost:6083/}
    # USB device access is host/OS-specific; wireless ADB needs only network + adb connect.
    # devices:
    #   - /dev/bus/usb
    # privileged: true
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: computer-with-agent-gateway:local
    networks: [computer_internal]
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      COMPUTER_API_TOKEN: ${COMPUTER_API_TOKEN:-dev-token}
      GATEWAY_PUBLIC_BASE: ${GATEWAY_PUBLIC_BASE:-http://localhost:9000}
      WORKER_INVENTORY_PATH: /etc/computer/workers.json
      REQUIRE_WORKER_INVENTORY: "1"
      SESSION_TTL_SEC: ${SESSION_TTL_SEC:-600}
      PARKED_TTL_SEC: ${PARKED_TTL_SEC:-1800}
    volumes:
      # Host file must exist (missing path → Docker mounts an empty dir → gateway exits).
      # With phone profile use: WORKER_INVENTORY_FILE=./gateway/workers.with-phone.json
      - ${WORKER_INVENTORY_FILE:-./gateway/workers.json}:/etc/computer/workers.json:ro
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

networks:
  computer_internal:
    driver: bridge
    name: computer_internal
